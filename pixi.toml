[workspace]
name = "jupyter-with-mcp-container"
channels = ["https://mirrors.tuna.tsinghua.edu.cn/anaconda/cloud/conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.12.*"
jupyterlab = ">=4.4,<5"
jupyter-collaboration = ">=5,<6"
ipykernel = ">=6"
r-base = ">=4.4"
r-irkernel = ">=1.3"

[pypi-options]
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple"

[pypi-dependencies]
jupyter-mcp-server = ">=2.2.3"
